# Fly.io config. Setup and secrets: docs/deploy.md.
# Exactly ONE machine: live rooms are in memory and only one process may poll the bot.
app = "zone2-club"          # must be globally unique on Fly; change it if taken
primary_region = "lhr"      # London: between US and EU users

[build]
  [build.args]
    # Public values baked into the web build. Fill in after creating the bot and Mini App in BotFather.
    VITE_TELEGRAM_BOT_USERNAME = ""
    VITE_TELEGRAM_APP_SHORT_NAME = ""

[env]
  PORT = "8080"
  Z2_RUN_BOT = "true"
  Z2_CORS_ORIGINS = "[]"    # web app and API share one origin

[http_service]
  internal_port = 8080
  force_https = true
  # Never stop: a stopped machine drops live rooms and stops answering the bot.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
